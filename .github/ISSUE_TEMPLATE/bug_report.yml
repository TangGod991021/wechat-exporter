name: Bug 报告
description: 报告一个问题或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **请勿粘贴真实聊天内容、密钥、wxid、手机号等个人数据**。
        日志与截图请先脱敏。

  - type: input
    id: wechat_version
    attributes:
      label: 微信版本
      description: 在 微信 -> 设置 -> 关于 中查看
      placeholder: 例如 4.2.0.13
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 例如 Windows 11 26200
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？期望的结果是什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图（已脱敏）
      description: 可粘贴界面提示、任务日志或脱敏后的截图

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容中不包含真实聊天记录、密钥或个人信息
          required: true
